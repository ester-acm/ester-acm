<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0A10"/><stop offset="1" stop-color="#150F22"/></linearGradient>
  <radialGradient id="glow" cx=".78" cy=".5" r=".42"><stop stop-color="#8B5CF6" stop-opacity=".30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A78BFA" fill-opacity=".14"/></pattern>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#8B5CF6"/><stop offset=".6" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <clipPath id="clip"><rect width="880" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="880" height="300" fill="url(#bg)"/>
  <rect width="880" height="300" fill="url(#dots)"/>
  <rect width="880" height="300" fill="url(#glow)"/>
  <rect width="880" height="3" fill="url(#edge)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1">
    <text x="48" y="66" fill="#A78BFA">~/ester-acm $ <tspan fill="#E4E1EC">whoami</tspan><tspan fill="#22D3EE"> _<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="45" y="138" font-size="54" font-weight="700" letter-spacing="-1" fill="#F5F3FF">Ester Carvalho</text>
    <text x="48" y="194" font-size="21" fill="#E4E1EC">Founder <tspan fill="#A78BFA" font-weight="600">@ Deuxie</tspan></text>
    <text x="48" y="226" font-size="15" letter-spacing=".4" fill="#B8B2C6">Software Engineering  ·  AI  ·  Machine Learning</text>
  </g>
  <rect x="48" y="156" width="56" height="4" rx="2" fill="url(#edge)"/>
  <text x="48" y="268" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#8E889C">RECIFE, BR  ·  BUILDING IDEAS INTO USEFUL TECHNOLOGY</text>

  <!-- agent network -->
  <g fill="none" stroke="#A78BFA">
    <circle cx="700" cy="150" r="112" stroke-opacity=".10"/>
    <circle cx="700" cy="150" r="34" stroke-opacity=".45" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0 700 150" to="360 700 150" dur="40s" repeatCount="indefinite"/></circle>
    <g stroke="#8B5CF6" stroke-opacity=".45">
      <path d="M700 150L618 86M700 150L784 80M700 150L808 172M700 150L748 240M700 150L626 226M700 150L586 150"/>
    </g>
    <path d="M618 86L784 80M808 172L748 240M626 226L586 150" stroke-opacity=".18" stroke-dasharray="2 6"/>
  </g>
  <g fill="#22D3EE">
    <circle r="2.5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M700 150L784 80"/></circle>
    <circle r="2.5"><animateMotion dur="3.2s" begin="-1s" repeatCount="indefinite" path="M626 226L700 150"/></circle>
    <circle r="2.5"><animateMotion dur="2.9s" begin="-2s" repeatCount="indefinite" path="M700 150L808 172"/></circle>
    <circle r="2.5"><animateMotion dur="3.6s" begin="-.5s" repeatCount="indefinite" path="M618 86L700 150"/></circle>
  </g>
  <g fill="#0B0A10" stroke="#A78BFA" stroke-width="1.5">
    <circle cx="618" cy="86" r="5"><animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="784" cy="80" r="5"><animate attributeName="r" values="5;7;5" dur="3s" begin="-.5s" repeatCount="indefinite"/></circle>
    <circle cx="808" cy="172" r="5"><animate attributeName="r" values="5;7;5" dur="3s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="748" cy="240" r="5"><animate attributeName="r" values="5;7;5" dur="3s" begin="-1.5s" repeatCount="indefinite"/></circle>
    <circle cx="626" cy="226" r="5"><animate attributeName="r" values="5;7;5" dur="3s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="586" cy="150" r="5"><animate attributeName="r" values="5;7;5" dur="3s" begin="-2.5s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="700" cy="150" r="16" fill="#8B5CF6" fill-opacity=".18"><animate attributeName="r" values="14;20;14" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="150" r="8" fill="#8B5CF6"/>
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1" fill="#8E889C">
    <text x="602" y="70">pm</text><text x="772" y="64">arch</text><text x="820" y="176">dev</text>
    <text x="760" y="258">qa</text><text x="600" y="250">sec</text><text x="548" y="154">ops</text>
  </g>
  <rect x=".5" y=".5" width="879" height="299" rx="15.5" fill="none" stroke="#8B5CF6" stroke-opacity=".35"/>
</g>
</svg>
